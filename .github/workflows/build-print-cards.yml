# Batch-generate print-ready Morning Pick-Me-Up cards + pack cover sheets.
#
# Each card gets a unique serial and QR. Output lands in print/ (gitignored),
# so this workflow packages it as a downloadable artifact instead of committing
# it — grab the zip from the run's summary page, no terminal required.
#
# For a REAL print run, add a repo secret KPMU_PROGRAM_KEY (Settings → Secrets
# and variables → Actions). Without it the cards are signed with the public
# demo key — fine for samples, never for cards you actually hand out.
name: Build print cards

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Serial year'
        required: true
        default: '2026'
      start:
        description: 'First serial number'
        required: true
        default: '1'
      count:
        description: 'How many cards to generate'
        required: true
        default: '100'
      allow_demo_key:
        description: 'Allow a demo-key run when KPMU_PROGRAM_KEY is not set (produces SAMPLES only — never hand these out)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependencies
        run: pip install fonttools==4.63.0 brotli==1.2.0 uharfbuzz==0.55.0 segno==1.6.6 cairosvg==2.9.0

      - name: Build cards
        id: build
        env:
          KPMU_PROGRAM_KEY: ${{ secrets.KPMU_PROGRAM_KEY }}
          ALLOW_DEMO: ${{ inputs.allow_demo_key }}
          YEAR: ${{ inputs.year }}
          START: ${{ inputs.start }}
          COUNT: ${{ inputs.count }}
        run: |
          set -euo pipefail
          if [ -z "${KPMU_PROGRAM_KEY:-}" ] && [ "$ALLOW_DEMO" != "true" ]; then
            echo "::error::KPMU_PROGRAM_KEY is not set. Real cards need it (Settings → Secrets → Actions). To build unusable SAMPLES on purpose, re-run with 'allow_demo_key' checked." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 tools/build_cards.py --year "$YEAR" --start "$START" --count "$COUNT"
          # count real cards only — card-back.svg is not a card
          cards=$(find print/cards -name 'card-*.svg' ! -name 'card-back.svg' | wc -l | tr -d ' ')
          packs=$(find print/packs -name 'pack-*.svg' | wc -l | tr -d ' ')
          if [ -z "${KPMU_PROGRAM_KEY:-}" ]; then
            echo "demo=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ **DEMO SAMPLES** — built with the public demo key. These will NOT validate against a real PROGRAM_KEY; never hand them out." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "demo=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Generated **$cards cards** and **$packs pack sheets** — each a true-size print-ready PDF (3.5×2in) plus its SVG." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cards
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ inputs.year }}-${{ inputs.start }}-plus${{ inputs.count }}${{ steps.build.outputs.demo == 'true' && '-DEMO-SAMPLES' || '' }}
          path: print/
          if-no-files-found: error
          # serials + valid check letters are forgeable material — don't linger
          retention-days: 7
