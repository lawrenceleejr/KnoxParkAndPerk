<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knox Pick-Me-Up — Page not found</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101a30">
<!-- GitHub Pages serves this for any unknown path on the custom domain, so
     every asset is referenced root-relative (never relative to the bad URL). -->
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root {
    --paper: #faf5eb; --ink: #241a10; --night: #101a30; --night-2: #0a101f;
    --cream: #faf5eb; --cream-2: #b9b3a4; --orange: #ff8200; --gold: #eda953;
    --f-serif: 'Fraunces', Georgia, serif;
    --f-sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--f-sans);
    background: linear-gradient(180deg, var(--night), var(--night-2));
    color: var(--cream);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2rem 1.25rem;
  }
  main { max-width: 34rem; }
  img.mark { width: 108px; height: 108px; margin: 0 auto 1.5rem; display: block; }
  .code { font-family: var(--f-serif); font-size: 1rem; letter-spacing: .28em;
          text-transform: uppercase; color: var(--gold); margin-bottom: .75rem; }
  h1 { font-family: var(--f-serif); font-weight: 600; font-size: clamp(2rem, 6vw, 3rem);
       line-height: 1.08; color: var(--paper); margin-bottom: 1rem; }
  p { color: var(--cream-2); font-size: 1.0625rem; line-height: 1.55; margin-bottom: 2rem; }
  .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: .8rem 1.4rem; border-radius: 999px;
    font-weight: 600; text-decoration: none; font-size: 1rem;
  }
  a.primary { background: var(--orange); color: var(--night); }
  a.ghost { border: 1.5px solid var(--rule-dark, rgba(250,245,235,.28)); color: var(--paper); }
  a.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/assets/logo-mark.svg" alt="Knox Pick-Me-Up">
  <p class="code">Error 404</p>
  <h1>This page took a different ride home.</h1>
  <p>That link didn&rsquo;t lead anywhere on knoxpickmeup.org. Let&rsquo;s get
     you back to the program &mdash; or straight to the shops that redeem the card.</p>
  <div class="actions">
    <a class="btn primary" href="/">Back to home</a>
    <a class="btn ghost" href="/#findus">Find a participating shop</a>
  </div>
</main>
